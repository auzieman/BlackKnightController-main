# Operator-started tunnels.
# Run one of:
#   ssh -N lab-bkc-ipfire-tunnel
#   ssh -N lab-openstack-tunnels
#   ssh -N lab-bkc-openstack-tunnel
#   ssh -N lab-portainer-openstack-agent-tunnel
#   ssh -N lab-ai-worker-tunnels
#
# Then use the corresponding localhost URLs.

Host lab-bkc-ipfire-tunnel
  HostName 10.20.0.254
  User root
  ProxyJump lab-ns1
  ExitOnForwardFailure yes
  LocalForward 15000 10.20.0.232:5000

Host lab-openstack-tunnels
  HostName 192.168.1.10
  User root
  ExitOnForwardFailure yes
  LocalForward 18443 10.20.0.240:443
  LocalForward 18080 10.20.0.232:18081
  LocalForward 15000 10.20.0.232:5000
  LocalForward 19092 10.20.0.240:19092

Host lab-bkc-openstack-tunnel
  HostName 192.168.1.10
  User root
  ExitOnForwardFailure yes
  LocalForward 15000 10.20.0.232:5000

Host lab-portainer-openstack-agent-tunnel
  HostName 192.168.1.10
  User root
  ExitOnForwardFailure yes
  LocalForward 19092 10.20.0.240:19092

Host lab-ai-worker-tunnels
  HostName 192.168.1.10
  User root
  ExitOnForwardFailure yes
  LocalForward 11143 10.20.0.130:11434
  LocalForward 18088 10.20.0.130:8080
