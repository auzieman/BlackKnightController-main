# BlackKnightController lab operator SSH profile.
#
# Install locally with:
#   mkdir -p ~/.ssh/config.d
#   cp ops/workstation-ssh/bkc-lab.conf ~/.ssh/config.d/bkc-lab.conf
#   grep -qxF 'Include ~/.ssh/config.d/*.conf' ~/.ssh/config || echo 'Include ~/.ssh/config.d/*.conf' >> ~/.ssh/config
#
# Intent:
# - The workstation does not need direct routes to every 10.20.0.0/24 host.
# - ns1 is the default jump/bastion because it is reachable from the operator LAN.
# - IPFire can later replace or complement ns1 for NAT/VPN policy.
# - LocalForward entries are explicit and operator-started, not always-on.

Host lab-ns1 ns1.lab.auzietek.com ns1
  HostName 192.168.1.10
  User root
  IdentitiesOnly no
  ServerAliveInterval 30
  ServerAliveCountMax 3

Host lab-edge swarm1.lab.auzietek.com swarm1
  HostName 192.168.1.15
  User root
  IdentitiesOnly no
  ServerAliveInterval 30
  ServerAliveCountMax 3

Host lab-ipfire ipfire.lab.auzietek.com ipfire
  HostName 10.20.0.254
  User root
  ProxyJump lab-ns1
  IdentitiesOnly no
  ServerAliveInterval 30
  ServerAliveCountMax 3

Host lab-openstack server1.lab.auzietek.com openstack01.lab.auzietek.com server1
  HostName 10.20.0.240
  User root
  ProxyJump lab-ns1
  IdentitiesOnly no
  ServerAliveInterval 30
  ServerAliveCountMax 3

