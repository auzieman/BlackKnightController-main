# BKC one-shot Proxmox ISO lane. Exact server2 LOM only.
host r630-proxmox-01-pxe {
  hardware ethernet 20:04:0f:e9:70:40;
  fixed-address 10.20.0.241;
  next-server 10.20.0.10;

  if exists user-class and option user-class = "iPXE" {
    filename "http://10.20.0.10/pxe/server2-proxmox.ipxe";
    option bootfile-name "http://10.20.0.10/pxe/server2-proxmox.ipxe";
  } else {
    filename "undionly.kpxe";
    option bootfile-name "undionly.kpxe";
  }
}
