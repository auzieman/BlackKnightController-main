worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    upstream esxi_tls {
        server 10.20.0.114:443;
    }

    upstream esxi_swarm_portainer_agent {
        server 10.20.0.121:9001;
    }

    server {
        listen 8443;
        proxy_pass esxi_tls;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }

    server {
        listen 19091;
        proxy_pass esxi_swarm_portainer_agent;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    server {
        listen 8080;
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }

    server {
        listen 8081;
        location = /proxmoxlib.js {
            root /usr/share/nginx/proxmox-edge;
            add_header Cache-Control "no-store";
        }
        location / {
            proxy_ssl_verify off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-Ssl off;
            proxy_redirect https://10.20.0.9:8006/ /;
            proxy_redirect https://10.20.0.9/ /;
            proxy_pass https://10.20.0.9:8006;
        }
    }

    server {
        listen 8082;
        location = / {
            return 302 /horizon/;
        }
        location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_redirect http://10.20.0.240/ /;
            proxy_pass http://10.20.0.240;
        }
    }

    server {
        listen 8083;
        location / {
            proxy_pass http://10.20.0.100;
        }
    }

    server {
        listen 8084;
        location / {
            proxy_pass http://192.168.1.15:5000;
        }
    }

    server {
        listen 8085;
        location / {
            proxy_pass http://192.168.1.15:3000;
        }
    }

    server {
        listen 8086;
        location / {
            proxy_ssl_verify off;
            proxy_pass https://192.168.1.15:9443;
        }
    }

    server {
        listen 8087;
        location / {
            proxy_ssl_verify off;
            proxy_set_header Host 10.20.0.114;
            proxy_pass https://10.20.0.114;
        }
    }

    server {
        listen 8088;
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_pass http://10.20.0.240:8080;
        }
    }

    server {
        listen 8089;
        location / {
            proxy_pass http://10.20.0.240:6080;
        }
    }

    server {
        listen 8090;
        location / {
            proxy_pass http://10.20.0.230:5000;
        }
    }
}
