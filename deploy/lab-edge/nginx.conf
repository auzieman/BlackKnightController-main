worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    upstream esxi_tls {
        server 10.20.0.114:443;
    }

    upstream esxi_swarm_portainer_agent {
        server 10.20.0.121:9001;
    }

    upstream openstack_swarm_portainer_agent {
        # Provider NIC path 10.20.0.230:9001 depends on server1 eno2/br-ex
        # carrier. Keep the operator-facing edge stable by using the server1
        # Neutron namespace tunnel when the direct provider bridge is offline.
        server 10.20.0.240:19092;
    }

    server {
        listen 8443;
        proxy_pass esxi_tls;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }

    server {
        listen 19091;
        proxy_pass esxi_swarm_portainer_agent;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }

    server {
        listen 19092;
        proxy_pass openstack_swarm_portainer_agent;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /run/secrets/lab_auzietek_fullchain.pem;
    ssl_certificate_key /run/secrets/lab_auzietek_privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LabEdgeSSL:10m;
    ssl_session_timeout 1h;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $host $openwebui_upstream {
        default 10.20.0.232:8088;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    server {
        listen 8080;
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }

    server {
        listen 8081;
        location = /proxmoxlib.js {
            root /usr/share/nginx/proxmox-edge;
            add_header Cache-Control "no-store";
        }
        location / {
            proxy_ssl_verify off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-Ssl off;
            proxy_redirect https://10.20.0.9:8006/ /;
            proxy_redirect https://10.20.0.9/ /;
            proxy_pass https://10.20.0.9:8006;
        }
    }

    server {
        listen 8082;
        location = / {
            return 302 /horizon/;
        }
        location / {
            proxy_set_header Host 10.20.0.240;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_redirect http://10.20.0.240/ /;
            proxy_pass http://10.20.0.240;
        }
    }

    server {
        listen 8083;
        location / {
            proxy_pass http://10.20.0.100;
        }
    }

    server {
        listen 8084;
        location / {
            # The edge-local BKC container is emergency fallback only.
            # Redirect operators to the primary OpenStack-backed hostname so
            # pipeline runs do not split-brain between two controllers.
            return 302 https://bkc.lab.auzietek.com$request_uri;
        }
    }

    server {
        listen 8085;
        location / {
            proxy_pass http://192.168.1.15:3000;
        }
    }

    server {
        listen 8086;
        location / {
            proxy_ssl_verify off;
            proxy_pass https://192.168.1.15:9443;
        }
    }

    server {
        listen 8087;
        location / {
            proxy_ssl_verify off;
            proxy_set_header Host 10.20.0.114;
            proxy_pass https://10.20.0.114;
        }
    }

    server {
        listen 8088;
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_pass http://$openwebui_upstream;
        }
    }

    server {
        listen 8089;
        location / {
            proxy_pass http://10.20.0.240:6080;
        }
    }

    server {
        listen 8090;
        location / {
            # OpenStack tenant app canary exposed through the normal Neutron
            # floating/service lane reserved on ns1-managed 10.20.0.0/24.
            # 10.20.0.232 -> bkc-swarm-mgr-01 / 172.24.10.183:18081.
            proxy_pass http://10.20.0.232:18081;
        }
    }

    server {
        listen 8091;
        location / {
            proxy_pass http://10.20.0.121:18081;
        }
    }

    server {
        listen 80;
        server_name
            lab.auzietek.com
            swarm1.lab.auzietek.com
            edge.lab.auzietek.com
            bkc.lab.auzietek.com
            bkc-tickets-01.lab.auzietek.com
            bkc-os.lab.auzietek.com
            blackknight-os.lab.auzietek.com
            grafana.lab.auzietek.com
            portainer.lab.auzietek.com
            openstack.lab.auzietek.com
            proxmox.lab.auzietek.com
            esxi.lab.auzietek.com
            openwebui.lab.auzietek.com
            microblog.lab.auzietek.com
            auzietek.lab.auzietek.com
            blackknight.lab.auzietek.com
            linux-users.lab.auzietek.com
            retro-users.lab.auzietek.com;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name lab.auzietek.com swarm1.lab.auzietek.com edge.lab.auzietek.com;

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name bkc.lab.auzietek.com;

        location / {
            # Main lab BKC now lives on the OpenStack Docker Swarm.
            # 10.20.0.232 is the Neutron floating/service lane for bkc-swarm-mgr-01.
            proxy_pass http://10.20.0.232:5000;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name bkc-tickets-01.lab.auzietek.com;

        location / {
            # vmid138 ticket board host; API remains internal on :8095.
            proxy_pass http://10.20.0.116;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name bkc-os.lab.auzietek.com blackknight-os.lab.auzietek.com;

        location / {
            proxy_pass http://10.20.0.232:5000;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name grafana.lab.auzietek.com;

        location / {
            proxy_pass http://192.168.1.15:3000;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name portainer.lab.auzietek.com;

        location / {
            proxy_ssl_verify off;
            proxy_pass https://192.168.1.15:9443;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name openstack.lab.auzietek.com;

        location = / {
            return 302 /horizon/;
        }

        location / {
            proxy_set_header Host 10.20.0.240;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect http://10.20.0.240/ /;
            proxy_pass http://10.20.0.240;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name proxmox.lab.auzietek.com;

        location = /proxmoxlib.js {
            root /usr/share/nginx/proxmox-edge;
            add_header Cache-Control "no-store";
        }

        location / {
            proxy_ssl_verify off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;
            proxy_redirect https://10.20.0.9:8006/ /;
            proxy_redirect https://10.20.0.9/ /;
            proxy_pass https://10.20.0.9:8006;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name esxi.lab.auzietek.com;

        location / {
            proxy_ssl_verify off;
            proxy_set_header Host 10.20.0.114;
            proxy_pass https://10.20.0.114;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name openwebui.lab.auzietek.com;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_pass http://$openwebui_upstream;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name
            microblog.lab.auzietek.com
            auzietek.lab.auzietek.com
            blackknight.lab.auzietek.com
            linux-users.lab.auzietek.com
            retro-users.lab.auzietek.com;

        location / {
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://10.20.0.121:18081;
        }
    }
}
